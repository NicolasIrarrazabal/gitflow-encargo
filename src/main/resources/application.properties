spring.application.name=microservicio-auth
server.port=8080

# IE1 — endpoints de observabilidad expuestos: health (Docker),
# info, metrics (JSON), prometheus (scrape) y loggers.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# CloudWatch Metrics export (Micrometer → AWS CloudWatch)
# Namespace donde aparecerán las métricas en CloudWatch Metrics
management.metrics.export.cloudwatch.namespace=microservicio-auth
# Intervalo de publicación (1 minuto)
management.metrics.export.cloudwatch.step=1m
# Batch size para envío por lotes
management.metrics.export.cloudwatch.batchSize=20

# AWS — Region por defecto (sobre-escribible por variable de entorno)
aws.region=${AWS_REGION:us-east-1}

# Tags comunes aplicados a todas las métricas
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${ENVIRONMENT:dev}