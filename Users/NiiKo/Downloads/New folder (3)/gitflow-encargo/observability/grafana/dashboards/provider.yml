# ============================================================
# IE3 — Grafana dashboards provider
# ============================================================
# Indica a Grafana dónde buscar dashboards JSON para provisionarlos
# automáticamente al iniciar.

apiVersion: 1

providers:
  - name: 'Microservicio Auth'
    orgId: 1
    folder: 'Microservicio Auth'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards