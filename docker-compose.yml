version: '3.8'

services:
  microservicio-auth:
    image: ${DOCKER_USERNAME}/microservicio-auth:${IMAGE_TAG:-latest}
    container_name: auth_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: microservicio-auth
      SERVER_PORT: 8080
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  backend:
    driver: bridge
