version: '3.8'

services:
  # ==========================================
  # Contenedor del Microservicio Auth
  # ==========================================
  microservicio-auth:
    build: .
    container_name: auth_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Variables de entorno inyectadas desde el sistema (sin archivo .env por seguridad)
      SPRING_APPLICATION_NAME: microservicio-auth
      SERVER_PORT: 8080
    healthcheck:
      # Verifica que el servicio esté listo antes de declararlo disponible
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/auth/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
