version: '3.8'

services:

  microservicio-auth:
    build: .
    container_name: auth_api
    restart: always                      # Se relanza automaticamente ante caidas
    ports:
      - "8080:8080"                      # HOST:CONTENEDOR

    # Variables inyectadas desde el entorno del host
    environment:
      SPRING_APPLICATION_NAME: microservicio-auth
      SERVER_PORT: 8080

    healthcheck:
      # Verifica disponibilidad cada 10s antes de declarar el contenedor como healthy
      # Si falla 5 veces consecutivas → estado unhealthy
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/auth/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s                  # Tiempo de gracia al arrancar Spring Boot
