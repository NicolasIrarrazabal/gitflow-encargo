version: "3.9"

networks:
  auth-network:
    driver: bridge

volumes:
  logs-data:

services:

  microservicio-auth:
    image: microservicio-auth:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microservicio-auth
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    volumes:
      - logs-data:/app/logs
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - auth-network
    depends_on:
      microservicio-auth:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
