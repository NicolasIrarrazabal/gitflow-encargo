# ============================================================
# IE2 — Service: expone el microservicio dentro del cluster
# ============================================================
# Tipo ClusterIP (interno). Para exposición externa usar
# Ingress + IngressController (no incluido en esta evaluación).
apiVersion: v1
kind: Service
metadata:
  name: microservicio-auth
  namespace: microservicio-prod
  labels:
    app: microservicio-auth
  annotations:
    # ServiceMonitor para Prometheus Operator (alternativa a annotations)
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: microservicio-auth
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP