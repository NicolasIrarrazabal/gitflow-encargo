# IE3: le dice a Grafana donde buscar los dashboards JSON al iniciar.

apiVersion: 1

providers:
  - name: 'Microservicio Auth'
    orgId: 1
    folder: 'Microservicio Auth'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards