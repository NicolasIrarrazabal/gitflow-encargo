# ============================================================
# IE3 — Grafana datasource: Prometheus
# ============================================================
# Configuración de provisioning: Grafana levanta y conecta
# automáticamente Prometheus como datasource por defecto.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: "POST"