# IE3: scrape config de Prometheus para si mismo y el microservicio-auth.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "gitflow-encargo-prometheus"
    environment: "production"

scrape_configs:
  # Métricas del propio Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Microservicio de autenticación (Spring Boot Actuator)
  - job_name: "microservicio-auth"
    metrics_path: "/actuator/prometheus"
    scheme: "http"
    static_configs:
      # Target del contenedor en docker-compose
      - targets: ["microservicio-auth:8080"]
        labels:
          app: "microservicio-auth"
          component: "auth-api"

  # Cuando se ejecuta localmente con docker-compose, el target es:
  #   - "host.docker.internal:8080"
  # o el nombre del servicio: "microservicio-auth:8080"
  - job_name: "microservicio-auth-local"
    metrics_path: "/actuator/prometheus"
    scheme: "http"
    static_configs:
      - targets: ["microservicio-auth:8080"]
        labels:
          app: "microservicio-auth"
          environment: "local"