name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/**, release/**, hotfix/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar
        run: mvn clean compile -B

  test:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ejecutar tests
        run: mvn clean verify -B

      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  security:
    name: Analisis de Seguridad
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Autenticar Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Escaneo de dependencias
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t microservicio-auth:${{ github.sha }} .

      - name: Guardar imagen
        run: docker save microservicio-auth:${{ github.sha }} | gzip > imagen-docker.tar.gz

      - name: Subir imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: imagen-docker.tar.gz

  deploy:
    name: Despliegue Simulado
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4

      - name: Descargar imagen Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Cargar imagen Docker
        run: docker load < imagen-docker.tar.gz

      - name: Etiquetar imagen
        run: docker tag microservicio-auth:${{ github.sha }} microservicio-auth:latest

      - name: Levantar con Docker Compose
        run: docker compose up -d

      - name: Esperar que inicie
        run: sleep 45

      - name: Verificar que la app responde
        run: |
          curl --fail --retry 5 --retry-delay 5 http://localhost:8080/auth/health

      - name: Ver logs del contenedor
        if: always()
        run: docker compose logs

      - name: Apagar contenedores
        if: always()
        run: docker compose down
