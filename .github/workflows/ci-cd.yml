name: CI/CD Pipeline - Auth Microservice

# Se ejecuta SOLO al hacer Push (merge) hacia la rama 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. BUILD
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto
        run: mvn clean package -DskipTests

      - name: Guardar artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ==========================================
  # 2. PRUEBAS UNITARIAS
  # ==========================================
  pruebas-unitarias:
    name: Pruebas Unitarias
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas unitarias
        run: mvn test

      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ==========================================
  # 3A. ANÁLISIS DE CALIDAD - SONARCLOUD  (paralelo)
  # ==========================================
  security-sonar:
    name: SonarCloud
    needs: pruebas-unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Escaneo de calidad con SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ secrets.PROJECT_KEY_SONAR }}
          -Dsonar.organization=${{ secrets.ORGANIZATION_SONAR }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -DskipTests

  # ==========================================
  # 3B. ANÁLISIS DE VULNERABILIDADES - SNYK  (paralelo)
  # ==========================================
  security-snyk:
    name: Snyk Security
    needs: pruebas-unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Autenticar Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Análisis de dependencias (bloquea si falla)
        run: snyk test --severity-threshold=high --json > snyk-report.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Guardar reporte Snyk
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-security-report
          path: snyk-report.json

  # ==========================================
  # 4. BUILD DOCKER IMAGE
  # ==========================================
  build-docker:
    name: Build Docker Image
    needs: [ security-sonar, security-snyk ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/microservicio-auth:latest
            ${{ secrets.DOCKER_USERNAME }}/microservicio-auth:${{ github.sha }}

  # ==========================================
  # 5. DESPLIEGUE SIMULADO
  # ==========================================
  despliegue-simulado:
    name: Despliegue Simulado
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Levantar entorno simulado con Docker Compose
        run: docker-compose up -d

      - name: Verificar que el servicio responde
        run: |
          sleep 10
          curl --fail http://localhost:8080/actuator/health || exit 1

      - name: Detener entorno simulado
        if: always()
        run: docker-compose down