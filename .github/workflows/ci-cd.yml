name: CI/CD Pipeline - Auth Microservice

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── 1. BUILD ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto
        run: mvn clean package -DskipTests

      - name: Guardar artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ── 2. PRUEBAS UNITARIAS + COBERTURA ──────────────────────────────────────
  pruebas-unitarias:
    name: Pruebas Unitarias
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Usamos "verify" y no "test" para que JaCoCo valide los umbrales
      # (70% de líneas y 60% de ramas). Si no se cumple, el build falla aquí.
      - name: Ejecutar pruebas unitarias y verificar cobertura
        run: mvn verify

      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ── 3A. CALIDAD CON SONARCLOUD  (corre en paralelo con Snyk) ──────────────
  security-sonar:
    name: SonarCloud
    needs: pruebas-unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Escaneo de calidad con SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ secrets.PROJECT_KEY_SONAR }}
          -Dsonar.organization=${{ secrets.ORGANIZATION_SONAR }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.qualitygate.wait=true
          -DskipTests

  # ── 3B. VULNERABILIDADES CON SNYK  (corre en paralelo con SonarCloud) ─────
  security-snyk:
    name: Snyk Security
    needs: pruebas-unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Autenticar Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Análisis de dependencias (bloquea si hay vulns HIGH/CRITICAL)
        run: snyk test --severity-threshold=high --json > snyk-report.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Guardar reporte Snyk
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-security-report
          path: snyk-report.json

  # ── 4. BUILD Y PUSH DE IMAGEN DOCKER ──────────────────────────────────────
  build-docker:
    name: Build Docker Image
    needs: [security-sonar, security-snyk]
    # Solo publicamos en push directo a main; los PRs no deben tocar Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/microservicio-auth:latest
            ${{ secrets.DOCKER_USERNAME }}/microservicio-auth:${{ github.sha }}

  # ── 5. DESPLIEGUE SIMULADO ─────────────────────────────────────────────────
  despliegue-simulado:
    name: Despliegue Simulado
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Levantar entorno simulado con Docker Compose
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose up -d

      - name: Esperar que el servicio esté disponible (con reintentos)
        run: |
          for i in {1..12}; do
            curl -sf http://localhost:80/auth/health && echo "Servicio OK" && exit 0
            echo "Intento $i/12 — esperando 5s..."
            sleep 5
          done
          echo "ERROR: el servicio no respondió tras 60s"
          docker compose logs
          exit 1

      - name: Verificar endpoint de autenticación
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:80/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"1234"}')
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Detener entorno simulado
        if: always()
        run: docker compose down
